ServerName localhost

<VirtualHost *:80>
	ServerName kappsappsapi.fosenikt.no
	ServerAdmin me@mydomain.com
	DocumentRoot /var/www/html

	<Directory /var/www/html/>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Order deny,allow
		Allow from all
		Require all granted
	</Directory>

	# User uploads live under /data. They must NEVER be executed as code.
	# Disabling the PHP engine + denying any server-side script extension turns an
	# arbitrary-file-upload into a harmless static file instead of remote code execution.
	# The CSP sandbox + nosniff headers neutralize uploaded SVG/HTML that would
	# otherwise run JavaScript in the app's origin (stored XSS).
	<Directory /var/www/html/data/>
		php_admin_flag engine off
		<FilesMatch "\.(php|phtml|phar|php[0-9]|phps|pht|cgi|pl|py|sh|asp|aspx|htaccess)$">
			Require all denied
		</FilesMatch>
		Header always set X-Content-Type-Options "nosniff"
		Header always set Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'"
	</Directory>

	ErrorLog /proc/self/fd/1
	CustomLog /proc/self/fd/2 common
</VirtualHost>