name: Build and push Docker images

# Builds the api, frontend and scheduler images and pushes them to Docker Hub.
# Replaces the deprecated Docker Hub autobuild. The deploy stack (Portainer) pulls the
# ":latest" tags; the commit-SHA tag is kept for traceability / rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kapps-appstore-api
            context: ./api
            dockerfile: ./api/.docker/Dockerfile
          - image: kapps-appstore-frontend
            context: ./frontend
            dockerfile: ./frontend/.docker/Dockerfile
          - image: kapps-appstore-scheduler
            context: ./scheduler
            dockerfile: ./scheduler/.docker/Dockerfile

    name: build (${{ matrix.image }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            fosenikt/${{ matrix.image }}:latest
            fosenikt/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
